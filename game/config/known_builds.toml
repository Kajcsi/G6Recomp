# Supported game builds. A build is identified by its package version plus the SHA-256 of the
# main executable; the side DLLs from the same package are pinned too, so a mixed or modified
# install is caught at configure time. Every per-build config file is keyed by `id`.
#
# cmake/G6GameFiles.cmake reads this file with a deliberately small parser: keep each build as
# a [[build]] table of `key = "value"` lines followed by an optional [build.dll_sha256] table of
# `"file name" = "sha256"` lines. No arrays, inline tables, or multi-line strings.
#
# Hashes identify files; they are not derived content, so they belong here.

[[build]]
id = "1.0.2.1"
package_version = "1.0.2.1"
exe_name = "game_scarlett_master.exe"
# While this is empty, the configure step prints the hash of the executable it finds; record it
# here once that executable is confirmed to be this build.
exe_sha256 = ""

